version: '3.8'

services:
  noise-bot:
    image: ghcr.io/seth-ships-it/edmonton-noise-bot:latest
    build: .
    container_name: noise-bot-app
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - "audio"
    volumes:
      - ./config.json:/app/config.json
      - ./recordings:/app/recordings
      - ./adaptive-data:/app/adaptive-data
      - ./.archive-retention:/app/.archive-retention
      - ./noise_bot.log:/app/noise_bot.log
      - ./live_audio_state.json:/app/live_audio_state.json
      - ./fleet_database.json:/app/fleet_database.json
      - ./noise_detector.py:/app/noise_detector.py
      - ./dashboard.py:/app/dashboard.py
      - ./config_store.py:/app/config_store.py
      - ./adaptive_detector.py:/app/adaptive_detector.py
      - ./adaptive_runtime.py:/app/adaptive_runtime.py
      - ./adaptive_guard.py:/app/adaptive_guard.py
      - ./adaptive_report.py:/app/adaptive_report.py
      - ./event_metadata.py:/app/event_metadata.py
      - ./audio_classifier.py:/app/audio_classifier.py
      - ./station_network.py:/app/station_network.py
      - ./notifier.py:/app/notifier.py
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1

  watchtower:
    image: containrrr/watchtower:latest
    container_name: noise-bot-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup noise-bot-app
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.45
